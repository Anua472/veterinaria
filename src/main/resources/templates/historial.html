<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Consulta Veterinaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
<div class="container mt-5">
    <div class="card">
        <div class="card-header">Datos del Paciente</div>


        <div class="card-body">

            <table class="table">
                <tr class="table-info">
                    <th>Nombre</th>
                    <th>Especie</th>
                    <th>Raza</th>
                    <th>Edad</th>
                    <th>DNI Propietario</th>

                </tr>
                <tr>
                    <td th:text="${mascota.nombre}"></td>
                    <td th:text="${mascota.especie}"></td>
                    <td th:text="${mascota.raza}"></td>
                    <td th:text="${mascota.edad}"></td>
                    <td th:text="${mascota.dniPropietario}"></td>
                </tr>
            </table>


        </div>
    </div>
</div>
<!--Formulario para nueva entrada-->
<div class="card mb-4">
    <div class="card-header">Registrar Nueva Entrada</div>
    <div class="card-body">
        <form th:action="@{'/consulta/'+${mascota.idMascota}}" th:object="${nuevaVisita}" method="post">
            <input type="hidden" th:field="*{idHistorial}"/>
            <div class="mb-3">
                <label for="fecha">Fecha Consulta</label>
                <input type="date" class="form-control" id="fecha" th:field="*{fecha}" required>

            </div>
            <div class="mb-3">
                <label for="motivoConsulta" class="form-label">Motivo Consulta</label>
                <textarea class="form-control" id="motivoConsulta" th:field="*{motivo}" required></textarea>
            </div>
            <div class="mb-3">
                <label for="tratamiento" class="form-label">Tratamiento</label>
                <textarea class="form-control" id="tratamiento" th:field="*{tratamiento}"></textarea>
            </div>
            <div class="mb-3">
                <label for="observacion">Observaciones</label>
                <input type="text" class="form-control" id="observacion" th:field="*{observacion}">
            </div>
            <buttom type="submit" class="btn btn-success">Guardar Visita</buttom>
            <a th:href="@{/crud}" class="btn btn-succes">Volver al listado</a>
        </form>
        </div>
    </div>
<!--        Tabla de historial-->

        <div class="card">
            <div class="card-header">Historial Médico</div>
            <div class="card-body">
                <table class="table table-bordered table-striped border">
                    <tr class="table-info">
                        <th>Fecha</th>
                        <th>Motivo</th>
                        <th>Tratamiento</th>
                        <th>Observaciones</th>
                    </tr>
                    <tr th:each="visita : ${historial}">
                        <td th:text="${visital.fecha}"></td>
                        <td th:text="${visita.motivo}"></td>
                        <td th:text="${visita.tratamiento}"></td>
                        <td th:text="${visita.observacion}"></td>
                    </tr>
                    <tr th:if="${historial.isEmpty()}">
                        <td colspan="4" class="text-center">No hay historial médico registrado</td>
                    </tr>
                </table>
            </div>
        </div>





</body>
</html>
